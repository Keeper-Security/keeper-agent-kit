name: Validate Agent Kit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages-and-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_plugins.py
      - run: python -m unittest discover -s tests -v
      - run: rumdl check .
      - name: macOS system Bash compatibility
        if: runner.os == 'macOS'
        run: /bin/bash scripts/validate-plugins.sh
  typescript-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/keeper-sdk/skills/keeper-sdk/examples/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/keeper-sdk/skills/keeper-sdk/examples/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
