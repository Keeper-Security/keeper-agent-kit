version: "3"

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  act:
    desc: Smoke-test Linux validation workflows (Docker + act; no release/API actions)
    cmds:
      - ./scripts/act-all.sh

  fmt:
    desc: Format Markdown
    cmds:
      - rumdl check --fix .

  check:
    desc: Check Markdown without modifying files
    cmds:
      - rumdl check .

  test:
    desc: Run offline Python regression and SDK/parser tests
    cmds:
      - '{{default "python3" .PYTHON}} -m unittest discover -s tests -v'

  install:
    desc: Install dependencies
    env:
      BINSTALL_DISABLE_TELEMETRY: true
      BINSTALL_NO_CONFIRM: true
    cmds:
      - if ! command -v cargo-binstall >/dev/null 2>&1; then curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash; fi
      - cargo binstall rumdl prek
      - if [ -z "${SKIP_PREK_INSTALL:-}" ]; then prek install; else echo "Skipping prek install"; fi

  validate:
    desc: Validate plugins, safety, versions, and relative links (Python dev dependencies required)
    cmds:
      - ./scripts/validate-plugins.sh
